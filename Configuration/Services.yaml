services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Plan2net\FormRateLimiter\:
    resource: '../Classes/*'

  Plan2net\FormRateLimiter\Configuration\RateLimiterSettings:
    factory: ['@Plan2net\FormRateLimiter\Configuration\RateLimiterSettingsFactory', 'create']

  # Created by GeneralUtility::makeInstance() as an EXT:form hook in TYPO3 v12 and v13
  Plan2net\FormRateLimiter\Form\RejectBlockedAddresses:
    public: true

  Plan2net\FormRateLimiter\Form\RateLimitFinisher:
    public: true
    shared: false
